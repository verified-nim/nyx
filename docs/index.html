<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Table · NYX</title>
<meta name="description" content="Select the Nim and Nimony skills your agent needs and copy one install command.">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://verified-nim.github.io/nyx/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="skills.css">
</head>
<body>
<header class="bar">
  <div class="clamp">
    <h1>Skill Table</h1>
    <p id="sub">Nim 2 skills for Claude Code, Codex, Cursor and more</p>
    <button class="switch" id="lang" type="button" role="switch" aria-checked="false">Nimony<span class="track" aria-hidden="true"></span></button>
  </div>
</header>
<main>
  <div class="clamp" id="rows">
    <noscript><p class="status">This page needs JavaScript. Skills can also be named directly: <code>nyx install nim-testing nim-style-guide</code></p></noscript>
  </div>
</main>
<footer class="bar dock">
  <div class="clamp">
    <div class="stat" id="stat">
      <b id="rank"></b>
      <span id="count"></span>
      <span id="chars"></span>
      <div class="meter"><i id="meter"></i></div>
    </div>
    <div class="cmdrow">
      <div class="cmd" id="cmd"></div>
      <button class="copy" id="copy" type="button">Copy</button>
    </div>
    <p class="note">Run in the project root. Needs <a href="https://github.com/verified-nim/nyx">nyx</a> and a <a href="https://verified-nim.github.io/get-access.html">subscription</a>.</p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</footer>
<script src="skills.js"></script>
</body>
</html>
