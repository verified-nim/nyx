<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Table · NYX</title>
<meta name="description" content="Select the Nim and Nimony skills your agent needs and copy one install command.">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://verified-nim.github.io/nyx/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="skills.css">
</head>
<body>
<header class="page">
  <h1>Skill Table</h1>
  <p class="sub">Nim and Nimony skills for Claude Code, Codex, Cursor and more.</p>
</header>
<main class="page" id="rows">
  <noscript><p>This page needs JavaScript. You can also name skills directly: <code>nyx install nim-testing nim-style-guide</code></p></noscript>
</main>
<footer class="dock">
  <div class="page dockin">
    <div class="stat" id="stat">
      <div class="statline"><b id="rank"></b><span id="count"></span></div>
      <div class="meter"><i id="meter"></i></div>
      <div class="statline" id="chars"></div>
    </div>
    <div class="action">
      <div class="cmdrow">
        <div class="cmd empty" id="cmd"></div>
        <button class="copy" id="copy" type="button" aria-live="polite">Copy</button>
      </div>
      <div class="note" id="note">Run in your project root. Needs <a href="https://github.com/verified-nim/nyx">nyx</a> and a <a href="https://verified-nim.github.io/get-access.html">subscription</a>.</div>
    </div>
  </div>
</footer>
<script src="skills.js"></script>
</body>
</html>
